<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Personalitify — alışkanlıklar, hedefler, görevler ve kişisel gelişim için tek merkez."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Personalitify</title>
    <script>
      // Apply the saved theme and language before the first paint to avoid a flash.
      (function () {
        var theme = null;
        var language = null;
        try {
          theme = localStorage.getItem('pfy.theme');
          language = localStorage.getItem('pfy.language');
        } catch (error) {
          /* storage unavailable: defaults apply */
        }
        var dark =
          theme === 'dark' ||
          (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        if (language === 'en' || language === 'tr') document.documentElement.lang = language;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
